<svg xmlns="http://www.w3.org/2000/svg" width="842" height="340"
     viewBox="0 0 842 340" font-family="system-ui,Segoe UI,sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
          orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,1 L9,5 L0,9 z" fill="#0078d4"/>
  </marker>
</defs>
<rect width="842" height="340" fill="#fff"/>

<text x="30" y="34" font-size="22" font-weight="700" fill="#0078d4">Belt Height and Clearance Height</text>
