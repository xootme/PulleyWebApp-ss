<rect x="180" y="110.0" width="300" height="140.0" fill="#2f2f2f" opacity="0.88"/>
<text x="330.0" y="185.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">belt</text>

<line x1="504" y1="110.0" x2="504" y2="250.0" stroke="#0078d4" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="514" y="185.0" font-size="14" font-weight="700" fill="#0078d4">Belt Height 10 mm</text>
<line x1="684" y1="96" x2="684" y2="264.0" stroke="#d9480f" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="692" y="176.0" font-size="13" font-weight="700" fill="#d9480f">pulley height</text>
<text x="692" y="193.0" font-size="13" fill="#d9480f">10 + 2 = 12 mm</text>
<text x="170" y="108.0" text-anchor="end" font-size="12.5" fill="#1e293b">½ Clearance (1 mm)</text>
<text x="170" y="262.0" text-anchor="end" font-size="12.5" fill="#1e293b">½ Clearance (1 mm)</text>
<line x1="180" y1="96" x2="690" y2="96" stroke="#94a3b8" stroke-dasharray="3 3"/>
<line x1="180" y1="264.0" x2="690" y2="264.0" stroke="#94a3b8" stroke-dasharray="3 3"/>
<line x1="480" y1="110.0" x2="498" y2="110.0" stroke="#94a3b8" stroke-dasharray="3 3"/>
<line x1="480" y1="250.0" x2="498" y2="250.0" stroke="#94a3b8" stroke-dasharray="3 3"/>
<text x="30" y="306.0" font-size="13" fill="#475569">Belt Height: set it to your belt's width. Clearance Height adds to the pulley's height, half on each face, so the belt sits inside it.</text><text x="30" y="325.0" font-size="13" fill="#475569">Clearance is drawn at 2 mm so it shows; the default is Belt Height ÷ 20 (0.5 mm for a 10 mm belt). Both apply to the whole drive.</text>
</svg>