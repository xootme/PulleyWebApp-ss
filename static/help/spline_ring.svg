<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="522"
     viewBox="0 0 1000 522" font-family="system-ui,Segoe UI,sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5"
          orient="auto-start-reverse" markerUnits="strokeWidth">
    <path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/>
  </marker>
</defs>
<rect width="1000" height="522" fill="#fff"/>
<text x="30" y="36" font-size="24" font-weight="700" fill="#0078d4">Splined bore: retaining ring and washer</text>
<path d="M 208.23 402.15 L 451.77 402.15 L 451.77 148.50 L 448.27 148.50 L 448.27 136.15 L 451.77 136.15 L 451.77 120.00 L 208.23 120.00 L 208.23 136.15 L 211.73 136.15 L 211.73 148.50 L 208.23 148.50 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.2"/><path d="M 206.30 354.65 L 73.50 354.65 L 73.50 250.15 L 121.00 250.15 L 121.00 136.15 L 161.38 136.15 L 161.38 162.75 L 206.30 162.75 Z" fill="#dbe4ee" stroke="#334155" stroke-width="1.2"/><rect x="166.12" y="148.50" width="39.70" height="14.25" fill="#7fb3e6" stroke="#334155" stroke-width="1.0"/><rect x="163.75" y="137.10" width="47.98" height="11.40" fill="#1e293b" stroke="#1e293b" stroke-width="1.0"/><path d="M 453.70 354.65 L 586.50 354.65 L 586.50 250.15 L 539.00 250.15 L 539.00 136.15 L 498.62 136.15 L 498.62 162.75 L 453.70 162.75 Z" fill="#dbe4ee" stroke="#334155" stroke-width="1.2"/><rect x="454.17" y="148.50" width="39.70" height="14.25" fill="#7fb3e6" stroke="#334155" stroke-width="1.0"/><rect x="448.27" y="137.10" width="47.98" height="11.40" fill="#1e293b" stroke="#1e293b" stroke-width="1.0"/><line x1="330" y1="412.15" x2="330" y2="106.00" stroke="#475569" stroke-width="1" stroke-dasharray="10 3 2 3"/><line x1="161.38" y1="90.55" x2="498.62" y2="90.55" stroke="#0078d4" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="330.000" y="83.550" text-anchor="middle" font-size="14.000" font-weight="700" fill="#0078d4" paint-order="stroke" stroke="#fff" stroke-width="4.200" font-family="system-ui,Segoe UI,sans-serif">counterbore Ø35.5 (DIN 471 d4)</text><line x1="158.38" y1="162.75" x2="104.60" y2="162.75" stroke="#0078d4" stroke-width="0.8"/><line x1="158.38" y1="136.15" x2="104.60" y2="136.15" stroke="#0078d4" stroke-width="0.8"/><line x1="109.60" y1="162.75" x2="109.60" y2="136.15" stroke="#0078d4" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="117.600" y="154.450" text-anchor="start" font-size="14.000" font-weight="700" fill="#0078d4" paint-order="stroke" stroke="#fff" stroke-width="4.200" font-family="system-ui,Segoe UI,sans-serif"></text><text x="103.600" y="154.450" text-anchor="end" font-size="14.000" font-weight="700" fill="#0078d4" paint-order="stroke" stroke="#fff" stroke-width="4.200" font-family="system-ui,Segoe UI,sans-serif">2.8 deep</text><line x1="206.33" y1="136.15" x2="206.33" y2="120.00" stroke="#d9480f" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="214.334" y="133.075" text-anchor="start" font-size="14.000" font-weight="700" fill="#d9480f" paint-order="stroke" stroke="#fff" stroke-width="4.200" font-family="system-ui,Segoe UI,sans-serif"></text><text x="200.634" y="133.075" text-anchor="end" font-size="14.000" font-weight="700" fill="#d9480f" paint-order="stroke" stroke="#fff" stroke-width="4.200" font-family="system-ui,Segoe UI,sans-serif">n 1.7</text><path d="M 488.65 142.80 L 620.50 127.15" fill="none" stroke="#475569" stroke-width="1"/><circle cx="488.65" cy="142.80" r="2.5" fill="#475569"/><text x="626.500" y="132.150" text-anchor="start" font-size="15.000" font-weight="700" fill="#1e293b" font-family="system-ui,Segoe UI,sans-serif">retaining ring DIN 471 26 × 1.2</text><text x="626.500" y="150.150" text-anchor="start" font-size="13.000" font-weight="400" fill="#475569" font-family="system-ui,Segoe UI,sans-serif">McMaster 98541A128, in a groove 1.3 wide to Ø24.9 (DIN d2)</text><path d="M 486.27 155.62 L 620.50 181.15" fill="none" stroke="#475569" stroke-width="1"/><circle cx="486.27" cy="155.62" r="2.5" fill="#475569"/><text x="626.500" y="186.150" text-anchor="start" font-size="15.000" font-weight="700" fill="#1e293b" font-family="system-ui,Segoe UI,sans-serif">splined washer Ø34.5 × 1.5</text><text x="626.500" y="204.150" text-anchor="start" font-size="13.000" font-weight="400" fill="#475569" font-family="system-ui,Segoe UI,sans-serif">keys to the shaft, so the ring rubs it, not the pulley</text><path d="M 558.00 302.40 L 620.50 302.40" fill="none" stroke="#475569" stroke-width="1"/><circle cx="558.00" cy="302.40" r="2.5" fill="#475569"/><text x="626.500" y="307.400" text-anchor="start" font-size="15.000" font-weight="700" fill="#1e293b" font-family="system-ui,Segoe UI,sans-serif">pulley, cut through a spline slot</text><text x="626.500" y="325.400" text-anchor="start" font-size="13.000" font-weight="400" fill="#475569" font-family="system-ui,Segoe UI,sans-serif">hole 23.011 × 26.042 mm</text><path d="M 437.52 378.40 L 620.50 395.40" fill="none" stroke="#475569" stroke-width="1"/><circle cx="437.52" cy="378.40" r="2.5" fill="#475569"/><text x="626.500" y="400.400" text-anchor="start" font-size="15.000" font-weight="700" fill="#1e293b" font-family="system-ui,Segoe UI,sans-serif">sample shaft 22.970 × 25.635 mm</text><text x="626.500" y="418.400" text-anchor="start" font-size="13.000" font-weight="400" fill="#475569" font-family="system-ui,Segoe UI,sans-serif">5 mm past the other face, 1.7 (DIN n) past the groove</text><text x="500.000" y="466.000" text-anchor="middle" font-size="14.000" font-weight="400" fill="#475569" font-family="system-ui,Segoe UI,sans-serif">ISO 14:1982 Table 2, sliding (zones: ISO 286-2): the hole and shaft each at the middle of its tolerance zone.</text><text x="500.000" y="486.000" text-anchor="middle" font-size="14.000" font-weight="400" fill="#475569" font-family="system-ui,Segoe UI,sans-serif">The ring's counterbore is DIN 471's d4 wide and the groove's width deep (plus the washer), so the</text><text x="500.000" y="506.000" text-anchor="middle" font-size="14.000" font-weight="400" fill="#475569" font-family="system-ui,Segoe UI,sans-serif">ring sits flush. STL parts add the print compensation: the bore grows, the shaft shrinks.</text>
</svg>