[pytest]
testpaths = tests
addopts   = -q --tb=short -p cct_common.testing.record
markers   =
    slow: clearance×backlash combo tests (run with -m slow)
    sfa: STEP files read by NIST SFA, the one parser independent of OCCT (-m sfa -rs; tests/test_step_verifiers.py)
    freecad: STEP files read by FreeCAD (-m freecad -rs; tests/test_step_verifiers.py)
# What each test runs (cct_common.testing.record): recorded only when tests/suite.py
# sets CCT_TEST_MAP; these dict caches are cleared between test files so each file is
# seen running what it uses (lru_caches are found). small_step's --version/--help per binary.
cct_test_caches = exporters.step_worker_ss:_versions exporters.step_worker_ss:_help exporters.step_worker_ss:_version_checked
