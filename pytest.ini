[pytest]
testpaths = tests
addopts   = -q --tb=short
markers   =
    slow: clearance×backlash combo tests (run with -m slow)
    sfa: STEP files read by NIST SFA, the one parser independent of OCCT (-m sfa -rs; tests/test_step_verifiers.py)
    freecad: STEP files read by FreeCAD (-m freecad -rs; tests/test_step_verifiers.py)
