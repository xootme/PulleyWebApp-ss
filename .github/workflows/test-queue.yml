name: Queue System Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.14']

    services:
      flask:
        image: python:${{ matrix.python-version }}
        options: |
          --health-cmd="curl -f http://localhost:5001 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5001:5001
        env:
          PYTHONUNBUFFERED: 1
        volumes:
          - ${{ github.workspace }}:/app
        working_directory: /app
        run: |
          pip install -r requirements.txt
          python -m flask run --host=0.0.0.0 --port=5001

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Wait for Flask to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5001 2>/dev/null; then
              echo "Flask is ready"
              exit 0
            fi
            echo "Waiting for Flask... ($i/30)"
            sleep 2
          done
          echo "Flask failed to start"
          exit 1

      - name: Run pytest suite
        run: pytest tests/test_queue_pytest.py -v --tb=short

      - name: Run bash integration tests
        run: bash tests/test_queue.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            logs/trial_downloads.json
            test-results.txt

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Test Status
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Tests failed"
            exit 1
          fi
